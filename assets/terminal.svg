<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Animated terminal introducing Rishi">
  <defs>
    <clipPath id="c1"><rect x="20" y="54" height="24" width="0"><animate attributeName="width" values="0;0;760;760;0" keyTimes="0;0.0556;0.1444;0.9444;1" dur="18s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c2"><rect x="20" y="82" height="24" width="0"><animate attributeName="width" values="0;0;760;760;0" keyTimes="0;0.1778;0.2667;0.9444;1" dur="18s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c3"><rect x="20" y="118" height="24" width="0"><animate attributeName="width" values="0;0;760;760;0" keyTimes="0;0.3;0.3889;0.9444;1" dur="18s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c4"><rect x="20" y="146" height="24" width="0"><animate attributeName="width" values="0;0;760;760;0" keyTimes="0;0.4222;0.5111;0.9444;1" dur="18s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c5"><rect x="20" y="182" height="24" width="0"><animate attributeName="width" values="0;0;760;760;0" keyTimes="0;0.5444;0.6333;0.9444;1" dur="18s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c6"><rect x="20" y="210" height="24" width="0"><animate attributeName="width" values="0;0;760;760;0" keyTimes="0;0.6667;0.7556;0.9444;1" dur="18s" repeatCount="indefinite"/></rect></clipPath>
    <linearGradient id="glowline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0db7ed"/>
      <stop offset="1" stop-color="#5835cc"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; font-size: 16px; }
  </style>

  <!-- window -->
  <rect x="1" y="1" width="898" height="298" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <path d="M1 13 Q1 1 13 1 H887 Q899 1 899 13 V38 H1 Z" fill="#161b22"/>
  <line x1="1" y1="38" x2="899" y2="38" stroke="#30363d"/>
  <rect x="1" y="37" width="898" height="2" fill="url(#glowline)" opacity="0.8"/>
  <circle cx="22" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="19" r="6" fill="#27c93f"/>
  <text x="450" y="24" text-anchor="middle" fill="#8b949e" style="font-size:13px">rishi@fedora: ~/devportfolio-hub</text>

  <!-- lines (wipe-in typing effect) -->
  <text x="24" y="72" clip-path="url(#c1)"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">whoami</tspan></text>
  <text x="24" y="100" clip-path="url(#c2)" fill="#0db7ed">Rishi Choudhary · MCA @ Parul University · Vadodara</text>

  <text x="24" y="136" clip-path="url(#c3)"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">cat stack.txt</tspan></text>
  <text x="24" y="164" clip-path="url(#c4)" fill="#a371f7">Docker · Terraform · Jenkins · ArgoCD · Go · React</text>

  <text x="24" y="200" clip-path="url(#c5)"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">./status.sh</tspan></text>
  <text x="24" y="228" clip-path="url(#c6)" fill="#f0883e">✔ Building DevPortfolio Hub — open to DevOps internships</text>

  <!-- prompt + blinking cursor (appears after last line) -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.8778;0.9444" dur="18s" repeatCount="indefinite"/>
    <text x="24" y="264" fill="#3fb950">$</text>
    <rect x="44" y="250" width="9" height="18" fill="#e6edf3">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
